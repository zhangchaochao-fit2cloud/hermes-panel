name: Feature request
description: Suggest a capability or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would a good solution look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Sessions
        - Cron
        - Memory
        - Tools and plugins
        - Desktop packaging
        - VS Code extension
        - BFF/API
        - Documentation
        - Other
    validations:
      required: true

